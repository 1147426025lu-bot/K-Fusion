<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 350" width="1020" height="525" role="img" xmlns="http://www.w3.org/2000/svg">
<rect x="0" y="0" width="680" height="350" fill="#ffffff"/>
  <title>K-Fusion 实际形态：单一 Linux + PREEMPT_RT 域内的 CPU 分核隔离</title>
  <desc>单一 Linux 域，其中 CPU 3 被隔离专供融合 kthread 执行硬实时循环，CPU 0 至 2 作为 housekeeping 承担普通任务与系统中断。VFS、网络、驱动、glibc 同域直接可用。底部为已实现的三类隔离手段：内核启动参数、cset 与 cgroup、IRQ 亲和迁移。</desc>
  <g font-family="system-ui,-apple-system,'Segoe UI',sans-serif">

    <rect x="40" y="20" width="600" height="200" rx="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="64" y="44" font-size="14" font-weight="500" fill="#0C447C">K-Fusion 实际形态：单一 Linux + PREEMPT_RT 域</text>
    <text x="64" y="62" font-size="12" fill="#185FA5">VFS · 网络 · 驱动 · glibc 同域直接可用（富功能无需跨域）</text>

    <rect x="64" y="76" width="129" height="124" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="128" y="100" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle">CPU 0</text>
    <text x="128" y="118" font-size="11" fill="#888780" text-anchor="middle">housekeeping</text>
    <line x1="80" y1="130" x2="177" y2="130" stroke="#D3D1C7" stroke-width="0.5"/>
    <text x="128" y="154" font-size="12" fill="#444441" text-anchor="middle">普通任务</text>
    <text x="128" y="176" font-size="12" fill="#444441" text-anchor="middle">系统 IRQ</text>

    <rect x="205" y="76" width="129" height="124" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="269" y="100" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle">CPU 1</text>
    <text x="269" y="118" font-size="11" fill="#888780" text-anchor="middle">housekeeping</text>
    <line x1="221" y1="130" x2="318" y2="130" stroke="#D3D1C7" stroke-width="0.5"/>
    <text x="269" y="154" font-size="12" fill="#444441" text-anchor="middle">普通任务</text>
    <text x="269" y="176" font-size="12" fill="#444441" text-anchor="middle">系统 IRQ</text>

    <rect x="346" y="76" width="129" height="124" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="410" y="100" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle">CPU 2</text>
    <text x="410" y="118" font-size="11" fill="#888780" text-anchor="middle">housekeeping</text>
    <line x1="362" y1="130" x2="459" y2="130" stroke="#D3D1C7" stroke-width="0.5"/>
    <text x="410" y="154" font-size="12" fill="#444441" text-anchor="middle">普通任务</text>
    <text x="410" y="176" font-size="12" fill="#444441" text-anchor="middle">系统 IRQ</text>

    <rect x="487" y="76" width="129" height="124" rx="10" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.5"/>
    <text x="551" y="100" font-size="14" font-weight="500" fill="#173404" text-anchor="middle">CPU 3</text>
    <text x="551" y="118" font-size="11" fill="#3B6D11" text-anchor="middle">isolated</text>
    <line x1="503" y1="130" x2="600" y2="130" stroke="#97C459" stroke-width="0.5"/>
    <text x="551" y="150" font-size="12" fill="#173404" text-anchor="middle">融合 kthread</text>
    <text x="551" y="170" font-size="12" fill="#173404" text-anchor="middle">hrtimer</text>
    <text x="551" y="190" font-size="12" font-weight="500" fill="#3B6D11" text-anchor="middle">5 µs</text>

    <text x="64" y="244" font-size="12" fill="#5F5E5A">隔离手段（scripts/tune/ 已实现）</text>

    <rect x="64" y="256" width="176" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="152" y="278" font-size="12" font-weight="500" fill="#633806" text-anchor="middle">内核启动参数</text>
    <text x="152" y="296" font-size="11" fill="#854F0B" text-anchor="middle">isolcpus·nohz_full·rcu_nocbs</text>

    <rect x="252" y="256" width="176" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="340" y="278" font-size="12" font-weight="500" fill="#633806" text-anchor="middle">cset + cgroup</text>
    <text x="340" y="296" font-size="11" fill="#854F0B" text-anchor="middle">kthread 赶往 CPU 0-2</text>

    <rect x="440" y="256" width="176" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="528" y="278" font-size="12" font-weight="500" fill="#633806" text-anchor="middle">IRQ 亲和迁移</text>
    <text x="528" y="296" font-size="11" fill="#854F0B" text-anchor="middle">停 irqbalance · 迁中断</text>

  </g>
</svg>
