<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 380" width="1020" height="570" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
<rect x="0" y="0" width="680" height="380" fill="#ffffff"/>
  <title>NuttX inmate 在 Jailhouse 分区中的运行层级</title>
  <desc>Raspberry Pi 4B 上，Jailhouse 在 EL2 分区：root cell 跑 Linux（用户态 EL0 + 内核 EL1，CPU 0/2/3），rpi4-nuttx cell 跑独立 NuttX 实时域（rtlat 任务 + NuttX 内核，CPU 1）。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="600" height="320" rx="20" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="60" y="64" font-size="14" font-weight="500" fill="#2C2C2A">Raspberry Pi 4B · BCM2711 · 4× Cortex-A72</text>

  <rect x="60" y="76" width="560" height="36" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="74" y="99" font-size="13" font-weight="500" fill="#2C2C2A">Jailhouse hypervisor</text>
  <text x="270" y="99" font-size="12" fill="#444441">EL2 · 静态分区，无调度器 / 无虚拟 CPU</text>

  <rect x="60" y="124" width="260" height="180" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="74" y="146" font-size="13" font-weight="500" fill="#0C447C">root cell · Raspberry-Pi4</text>
  <text x="252" y="146" font-size="12" fill="#185FA5">CPU 0,2,3</text>

  <rect x="74" y="156" width="232" height="62" rx="8" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.5"/>
  <text x="86" y="178" font-size="13" font-weight="500" fill="#042C53">Linux 用户态 (EL0)</text>
  <text x="86" y="198" font-size="12" fill="#185FA5">Debian · getty · cyclictest</text>

  <rect x="74" y="226" width="232" height="66" rx="8" fill="#85B7EB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="86" y="248" font-size="13" font-weight="500" fill="#042C53">Linux 内核 (EL1)</text>
  <text x="86" y="266" font-size="12" fill="#0C447C">SMP PREEMPT（非 RT）</text>
  <text x="86" y="282" font-size="12" fill="#185FA5">单域融合的加速目标</text>

  <rect x="340" y="124" width="280" height="180" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="354" y="146" font-size="13" font-weight="500" fill="#085041">rpi4-nuttx cell</text>
  <text x="580" y="146" font-size="12" fill="#0F6E56">CPU 1</text>

  <rect x="354" y="156" width="252" height="62" rx="8" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="366" y="178" font-size="13" font-weight="500" fill="#04342C">rtlat 任务 (SCHED_FIFO)</text>
  <text x="366" y="198" font-size="12" fill="#0F6E56">周期 1ms · clock_nanosleep</text>

  <rect x="354" y="226" width="252" height="66" rx="8" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="366" y="248" font-size="13" font-weight="500" fill="#04342C">NuttX 内核 (EL1, flat)</text>
  <text x="366" y="266" font-size="12" fill="#085041">独立 OS · tickless 调度</text>
  <text x="366" y="282" font-size="12" fill="#0F6E56">未启用用户/内核分离 → 全特权</text>

  <text x="60" y="332" font-size="12" fill="#444441">物理 mini-UART (GPIO 14/15)：两域共用一根串口线 —— 唯一的观测口</text>
</svg>
