name: Platform x86_64 cross-build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  x86-kernel-o:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FUSE_AST_APPLY_SUGGEST: "0"
      CI_LITE: "1"
      CI_PLATFORM_X86: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build clang-19 llvm-19 llvm-dev libclang-dev \
            linux-headers-generic git python3 build-essential

      - name: Build PLCFusionPass
        run: |
          export PATH="/usr/lib/llvm-19/bin:$PATH"
          cd build && cmake .. && make PLCFusionPass -j"$(nproc)"

      - name: x86_64 platform validate (kernel.o only, no insmod)
        run: |
          export PATH="/usr/lib/llvm-19/bin:$PATH"
          PLC_PLATFORM=x86_64 bash scripts/platform/validate_build__平台构建验证.sh

      - name: Assert ELF machine is x86-64
        run: |
          obj="$(find test -name '*_kernel.o' -path '*platform_x86_64*' | head -1)"
          test -n "$obj"
          file -b "$obj" | grep -qi 'x86-64'
          echo "Verified: $obj"
