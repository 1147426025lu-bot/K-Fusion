<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs>
    <style>
      .title { font: 700 26px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #111; }
      .label { font: 600 16px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #111; }
      .small { font: 400 14px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #333; }
      .tiny { font: 400 12px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #555; }
      .host { fill: #eef4ff; stroke: #1a4b8c; stroke-width: 2.2; }
      .algo { fill: #fef3c7; stroke: #b45309; stroke-width: 2.2; }
      .stub { fill: #f0fdf4; stroke: #166534; stroke-width: 2; }
      .outer { fill: #fafafa; stroke: #444; stroke-width: 2.5; }
      .arrow { fill: none; stroke: #222; stroke-width: 2; marker-end: url(#ah); }
    </style>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#222"/>
    </marker>
  </defs>

  <text x="600" y="38" text-anchor="middle" class="title">Figure 3. Split kernelization: fused algorithm object vs. replaceable host module</text>
  <text x="600" y="64" text-anchor="middle" class="small">Application C code is split at link time — not a whole-process transplant into the kernel</text>

  <rect x="80" y="100" width="1040" height="520" class="outer" rx="12"/>
  <text x="600" y="132" text-anchor="middle" class="label">official_cycletest_mod.ko (example)</text>

  <!-- Host side -->
  <rect x="120" y="160" width="460" height="420" class="host" rx="10"/>
  <text x="350" y="192" text-anchor="middle" class="label">Host layer (manifest-selected, swappable)</text>

  <rect x="150" y="215" width="400" height="55" class="outer" rx="6"/>
  <text x="350" y="248" text-anchor="middle" class="small">plc_fused_host · FUSE_RUN_MAIN=1</text>

  <rect x="150" y="285" width="400" height="55" class="outer" rx="6"/>
  <text x="350" y="312" text-anchor="middle" class="small">plc_fused_timer_host · hrtimer sleep</text>
  <text x="350" y="330" text-anchor="middle" class="tiny">nanosleep → schedule_hrtimeout</text>

  <rect x="150" y="355" width="400" height="55" class="outer" rx="6"/>
  <text x="350" y="382" text-anchor="middle" class="small">plc_pthread_host (optional)</text>
  <text x="350" y="400" text-anchor="middle" class="tiny">pthread_create → kthread</text>

  <rect x="150" y="430" width="400" height="120" class="stub" rx="6"/>
  <text x="350" y="458" text-anchor="middle" class="small">plc_runtime_stubs · plc_* ABI</text>
  <text x="350" y="482" text-anchor="middle" class="tiny">kmalloc · mutex · timer · printf boundary</text>
  <text x="350" y="504" text-anchor="middle" class="tiny">plc_fix_mul_i64 (Q-only fixed-point)</text>
  <text x="350" y="526" text-anchor="middle" class="tiny">weak plc_fused_stats_tick</text>

  <!-- Algorithm side -->
  <rect x="620" y="160" width="460" height="420" class="algo" rx="10"/>
  <text x="850" y="192" text-anchor="middle" class="label">Fused algorithm layer (from user C via PLCFusionPass)</text>

  <rect x="650" y="220" width="400" height="70" class="outer" rx="6"/>
  <text x="850" y="250" text-anchor="middle" class="small">official_cycletest_kernel.o</text>
  <text x="850" y="272" text-anchor="middle" class="tiny">main · timerthread · fifothread (DCE-trimmed)</text>

  <rect x="650" y="310" width="400" height="110" class="outer" rx="6"/>
  <text x="850" y="340" text-anchor="middle" class="small">IR transforms applied at build time</text>
  <text x="850" y="364" text-anchor="middle" class="tiny">POSIX → plc_* remap · global DCE · Q fixed-point</text>
  <text x="850" y="386" text-anchor="middle" class="tiny">hot-path / WCET tail · static reloc (no GOT)</text>
  <text x="850" y="408" text-anchor="middle" class="tiny">validate: no float IR · no soft-float syms</text>

  <rect x="650" y="440" width="400" height="110" class="outer" rx="6"/>
  <text x="850" y="470" text-anchor="middle" class="small">Runtime invocation model</text>
  <text x="850" y="494" text-anchor="middle" class="tiny">insmod → module_init → kthread_create</text>
  <text x="850" y="516" text-anchor="middle" class="tiny">→ main() / timerthread() plain function calls</text>
  <text x="850" y="538" text-anchor="middle" class="tiny">shutdown_request → safe rmmod</text>

  <!-- Link arrows -->
  <path d="M 580 350 L 620 350" class="arrow"/>
  <text x="600" y="340" text-anchor="middle" class="tiny">link</text>
  <text x="600" y="372" text-anchor="middle" class="tiny">Kbuild</text>

  <!-- Bottom note -->
  <text x="600" y="648" text-anchor="middle" class="small">Contrast with cRTOS: isolation is spatial (dual OS) rather than artifact split within one PREEMPT_RT image</text>
</svg>
