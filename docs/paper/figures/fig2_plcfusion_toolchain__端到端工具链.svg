<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="780" viewBox="0 0 1700 780">
  <defs>
    <style>
      .title { font: 700 28px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #111; }
      .phase { font: 700 16px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #fff; }
      .label { font: 600 16px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #111; }
      .small { font: 400 14px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #333; }
      .tiny { font: 400 12px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #555; }
      .box { fill: #fafafa; stroke: #222; stroke-width: 2; rx: 8; }
      .box-blue { fill: #eef4ff; stroke: #1a4b8c; stroke-width: 2; }
      .box-green { fill: #f0fdf4; stroke: #166534; stroke-width: 2; }
      .box-amber { fill: #fffbeb; stroke: #b45309; stroke-width: 2; }
      .box-hl { fill: #eef4ff; stroke: #1a4b8c; stroke-width: 2; }
      .arrow { fill: none; stroke: #222; stroke-width: 2.2; marker-end: url(#ah); }
      .arrow-blue { fill: none; stroke: #1a4b8c; stroke-width: 2.2; marker-end: url(#ahb); }
    </style>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#222"/>
    </marker>
    <marker id="ahb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#1a4b8c"/>
    </marker>
  </defs>

  <text x="850" y="40" text-anchor="middle" class="title">Figure 2. PLCFusion end-to-end toolchain (Timed-C-style methodology on Raspberry Pi)</text>
  <text x="850" y="68" text-anchor="middle" class="small">Build-time transformation + runtime measurement + automated validation gates (cf. Timed C compiler → profile → analysis)</text>

  <!-- Phase bars -->
  <rect x="60" y="88" width="360" height="32" fill="#334155" rx="6"/>
  <text x="240" y="110" text-anchor="middle" class="phase">I. Specify</text>
  <rect x="440" y="88" width="420" height="32" fill="#1a4b8c" rx="6"/>
  <text x="650" y="110" text-anchor="middle" class="phase">II. Transform (compile-time)</text>
  <rect x="880" y="88" width="360" height="32" fill="#166534" rx="6"/>
  <text x="1060" y="110" text-anchor="middle" class="phase">III. Integrate</text>
  <rect x="1260" y="88" width="380" height="32" fill="#9a3412" rx="6"/>
  <text x="1450" y="110" text-anchor="middle" class="phase">IV. Evaluate (Pi, local)</text>

  <!-- Row 1: main pipeline boxes -->
  <rect x="80" y="150" width="150" height="70" class="box"/>
  <text x="155" y="182" text-anchor="middle" class="label">Manifest</text>
  <text x="155" y="204" text-anchor="middle" class="tiny">.env policy</text>

  <rect x="250" y="150" width="150" height="70" class="box"/>
  <text x="325" y="182" text-anchor="middle" class="label">C sources</text>
  <text x="325" y="204" text-anchor="middle" class="tiny">multi-TU</text>

  <path d="M 230 185 L 250 185" class="arrow"/>
  <path d="M 400 185 L 455 185" class="arrow-blue"/>

  <rect x="455" y="135" width="170" height="50" class="box-blue" rx="8"/>
  <text x="540" y="158" text-anchor="middle" class="label">plc_ast</text>
  <text x="540" y="176" text-anchor="middle" class="tiny">preflight</text>

  <rect x="455" y="195" width="170" height="50" class="box-blue" rx="8"/>
  <text x="540" y="218" text-anchor="middle" class="label">Clang → IR</text>
  <text x="540" y="236" text-anchor="middle" class="tiny">llvm-link</text>

  <path d="M 625 185 L 655 185" class="arrow-blue"/>

  <rect x="655" y="150" width="190" height="70" class="box-blue" rx="8"/>
  <text x="750" y="178" text-anchor="middle" class="label">PLCFusionPass</text>
  <text x="750" y="200" text-anchor="middle" class="tiny">remap · DCE · Q-fix</text>
  <text x="750" y="216" text-anchor="middle" class="tiny">low-jitter · WCET tail</text>

  <path d="M 845 185 L 875 185" class="arrow-blue"/>

  <rect x="875" y="150" width="150" height="70" class="box-green" rx="8"/>
  <text x="950" y="182" text-anchor="middle" class="label">kernel.o</text>
  <text x="950" y="204" text-anchor="middle" class="tiny">freestanding</text>

  <path d="M 1025 185 L 1055 185" class="arrow"/>

  <rect x="1055" y="135" width="160" height="50" class="box-green" rx="8"/>
  <text x="1135" y="158" text-anchor="middle" class="label">ignite_fused</text>
  <text x="1135" y="176" text-anchor="middle" class="tiny">host + stubs</text>

  <rect x="1055" y="195" width="160" height="50" class="box-green" rx="8"/>
  <text x="1135" y="218" text-anchor="middle" class="label">*.ko module</text>
  <text x="1135" y="236" text-anchor="middle" class="tiny">Kbuild link</text>

  <path d="M 1215 185 L 1275 185" class="arrow"/>

  <rect x="1275" y="150" width="150" height="70" class="box-amber" rx="8"/>
  <text x="1350" y="178" text-anchor="middle" class="label">insmod</text>
  <text x="1350" y="200" text-anchor="middle" class="tiny">kthread entry</text>

  <path d="M 1425 185 L 1475 185" class="arrow"/>

  <rect x="1475" y="150" width="165" height="70" class="box-amber" rx="8"/>
  <text x="1557" y="178" text-anchor="middle" class="label">Measurement</text>
  <text x="1557" y="200" text-anchor="middle" class="tiny">soak / stress</text>

  <!-- Artifacts row -->
  <rect x="80" y="280" width="1540" height="130" class="box" rx="10"/>
  <text x="850" y="310" text-anchor="middle" class="label">Automated artifacts &amp; gates (test/ · results/)</text>

  <rect x="110" y="330" width="200" height="58" class="box-blue" rx="6"/>
  <text x="210" y="355" text-anchor="middle" class="small">.detected.env</text>
  <text x="210" y="375" text-anchor="middle" class="tiny">entry / host infer</text>

  <rect x="330" y="330" width="200" height="58" class="box-blue" rx="6"/>
  <text x="430" y="355" text-anchor="middle" class="small">pre.ll / kernel.ll</text>
  <text x="430" y="375" text-anchor="middle" class="tiny">IR audit trail</text>

  <rect x="550" y="330" width="200" height="58" class="box-blue" rx="6"/>
  <text x="650" y="355" text-anchor="middle" class="small">validate.json</text>
  <text x="650" y="375" text-anchor="middle" class="tiny">no float IR · coverage</text>

  <rect x="770" y="330" width="200" height="58" class="box-blue" rx="6"/>
  <text x="870" y="355" text-anchor="middle" class="small">fusion_report</text>
  <text x="870" y="375" text-anchor="middle" class="tiny">remap / DCE stats</text>

  <rect x="990" y="330" width="200" height="58" class="box-green" rx="6"/>
  <text x="1090" y="355" text-anchor="middle" class="small">*.ko + modinfo</text>
  <text x="1090" y="375" text-anchor="middle" class="tiny">ko build gate</text>

  <rect x="1210" y="330" width="200" height="58" class="box-amber" rx="6"/>
  <text x="1310" y="355" text-anchor="middle" class="small">soak/stress logs</text>
  <text x="1310" y="375" text-anchor="middle" class="tiny">≥15 min formal runs</text>

  <rect x="1430" y="330" width="170" height="58" class="box-amber" rx="6"/>
  <text x="1515" y="355" text-anchor="middle" class="small">paper CSV</text>
  <text x="1515" y="375" text-anchor="middle" class="tiny">summarize.py</text>

  <!-- Comparison baselines on Pi -->
  <rect x="80" y="450" width="1540" height="280" class="box" rx="10"/>
  <text x="850" y="482" text-anchor="middle" class="label">On-device experimental baselines (same Pi, PREEMPT_RT, isolation profiles)</text>

  <rect x="120" y="510" width="440" height="190" class="box" rx="8"/>
  <text x="340" y="542" text-anchor="middle" class="label">B0: Userspace RT</text>
  <text x="340" y="570" text-anchor="middle" class="small">cyclictest / clock_nanosleep on isolated CPU</text>
  <text x="340" y="596" text-anchor="middle" class="small">Analog to PREEMPT_RT path in cRTOS paper</text>
  <text x="340" y="622" text-anchor="middle" class="tiny">scripts/paper/run_paper_userspace__*.sh</text>
  <text x="340" y="660" text-anchor="middle" class="tiny">Subject to timer interference &amp; syscall path</text>

  <rect x="590" y="510" width="440" height="190" class="box" rx="8"/>
  <text x="810" y="542" text-anchor="middle" class="label">B1: Hand-written kernel module</text>
  <text x="810" y="570" text-anchor="middle" class="small">plc_baseline_cyclic minimal hrtimer loop</text>
  <text x="810" y="596" text-anchor="middle" class="small">Shows manual in-kernel RT is possible but not scalable</text>
  <text x="810" y="622" text-anchor="middle" class="tiny">scripts/paper/run_paper_baseline_ko__*.sh</text>

  <rect x="1060" y="510" width="520" height="190" class="box-hl" rx="8"/>
  <text x="1320" y="542" text-anchor="middle" class="label">B2: PLCFusion fused (proposed)</text>
  <text x="1320" y="570" text-anchor="middle" class="small">Fused cyclictest / signaltest / plc_* via manifest pipeline</text>
  <text x="1320" y="596" text-anchor="middle" class="small">Compare jitter CDF &amp; abs_max vs B0/B1 under soak &amp; stress</text>
  <text x="1320" y="622" text-anchor="middle" class="tiny">scripts/paper/run_paper_baseline_matrix__*.sh</text>
  <text x="1320" y="660" text-anchor="middle" class="tiny">Cross-study: cRTOS numbers cited separately (x86, Fig. 1-A)</text>

  <!-- dashed link to cRTOS -->
  <path d="M 340 700 L 340 740 L 120 740 L 120 430" fill="none" stroke="#9a3412" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="200" y="728" class="tiny" fill="#9a3412">cRTOS (VEE'20): spatial split baseline — not executed on Pi</text>
</svg>
