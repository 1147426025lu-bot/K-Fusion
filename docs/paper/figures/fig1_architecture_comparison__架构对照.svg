<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="920" viewBox="0 0 1800 920">
  <defs>
    <style type="text/css"><![CDATA[
      text { font-family: "DejaVu Sans", "Liberation Sans", Arial, Helvetica, sans-serif; }
      .title { font-size: 26px; font-weight: 700; fill: #111; }
      .subtitle { font-size: 18px; font-weight: 600; fill: #222; }
      .label { font-size: 16px; font-weight: 600; fill: #111; }
      .small { font-size: 13px; font-weight: 400; fill: #333; }
      .tiny { font-size: 11px; font-weight: 400; fill: #555; }
      .box { fill: #fafafa; stroke: #222; stroke-width: 2; }
      .box-hl { fill: #eef4ff; stroke: #1a4b8c; stroke-width: 2.2; }
      .box-rt { fill: #fff7ed; stroke: #9a3412; stroke-width: 2; }
      .box-kern { fill: #f0fdf4; stroke: #166534; stroke-width: 2; }
      .divider { stroke: #bbb; stroke-width: 2; stroke-dasharray: 8 6; }
      .arrow { fill: none; stroke: #222; stroke-width: 2.2; marker-end: url(#arrowhead); }
      .arrow-blue { fill: none; stroke: #1a4b8c; stroke-width: 2.2; marker-end: url(#arrowhead-blue); }
      .arrow-orange { fill: none; stroke: #9a3412; stroke-width: 2; marker-end: url(#arrowhead-orange); stroke-dasharray: 6 4; }
      .hw { fill: #eee; stroke: #666; stroke-width: 1.8; }
      .badge { font-size: 12px; font-weight: 700; fill: #fff; }
    ]]></style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#222"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#1a4b8c"/>
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#9a3412"/>
    </marker>
  </defs>

  <text x="900" y="42" text-anchor="middle" class="title">Figure 1. Architectural comparison: cRTOS (spatial split) vs. PLCFusion (compiler split kernelization)</text>
  <text x="900" y="72" text-anchor="middle" class="small">Evaluation platform: Raspberry Pi + PREEMPT_RT (single Linux domain). cRTOS baseline from VEE 2020 (x86 + Jailhouse).</text>

  <line x1="900" y1="95" x2="900" y2="880" class="divider"/>

  <!-- LEFT: cRTOS -->
  <text x="450" y="118" text-anchor="middle" class="subtitle">(A) Compounded RTOS (cRTOS) - Yang and Shinjo, VEE 2020</text>
  <rect x="40" y="860" width="820" height="48" class="hw" rx="6"/>
  <text x="450" y="890" text-anchor="middle" class="label">COTS hardware (x86-64, VT-x, local APIC timer, shared memory bus)</text>

  <rect x="120" y="760" width="660" height="78" class="box" rx="8"/>
  <text x="450" y="790" text-anchor="middle" class="label">Jailhouse partitioning hypervisor</text>
  <text x="450" y="818" text-anchor="middle" class="small">Static CPU / memory / device partitioning | coschedule at realm boundary</text>

  <rect x="70" y="560" width="340" height="170" class="box-rt" rx="8"/>
  <text x="240" y="592" text-anchor="middle" class="label">Hard RT realm (sRTOS)</text>
  <text x="240" y="618" text-anchor="middle" class="small">NuttX | periodic control | bounded IRQ path</text>
  <rect x="95" y="640" width="290" height="68" class="box" rx="6"/>
  <text x="240" y="668" text-anchor="middle" class="small">Rich RT process (same toolchain / ELF as Linux)</text>
  <text x="240" y="692" text-anchor="middle" class="tiny">Local timers | RT devices | hard deadlines</text>

  <rect x="490" y="560" width="340" height="170" class="box" rx="8"/>
  <text x="660" y="592" text-anchor="middle" class="label">Normal realm (Linux GPOS)</text>
  <text x="660" y="618" text-anchor="middle" class="small">Unmodified Linux | networking | FS | GUI / X11</text>
  <rect x="515" y="640" width="290" height="68" class="box" rx="6"/>
  <text x="660" y="668" text-anchor="middle" class="small">Linux user processes and drivers</text>
  <text x="660" y="692" text-anchor="middle" class="tiny">Rich features without Linux kernel patches</text>

  <path d="M 410 705 Q 450 735 490 705" class="arrow-orange"/>
  <text x="450" y="748" text-anchor="middle" class="small">Remote system calls (cross-realm IPC)</text>

  <rect x="120" y="430" width="660" height="95" class="box" rx="8"/>
  <text x="450" y="462" text-anchor="middle" class="label">Isolation mechanism</text>
  <text x="450" y="488" text-anchor="middle" class="small">Spatial: separate OS instances | hypervisor-enforced resource caps</text>
  <text x="450" y="512" text-anchor="middle" class="tiny">Goal: zero/low contention on shared COTS resources during RT execution</text>

  <rect x="120" y="140" width="660" height="260" class="box" rx="8"/>
  <text x="450" y="172" text-anchor="middle" class="label">Developer / deployment view</text>
  <text x="160" y="210" class="small">- Dual-OS stack: hypervisor + NuttX port + Linux realm config</text>
  <text x="160" y="240" class="small">- Same binary runs in sRTOS; Linux services via remote syscall</text>
  <text x="160" y="270" class="small">- Reported ~4 us jitter and bounded IRQ latency (x86 testbed)</text>
  <text x="160" y="300" class="small">- Requires VT-x class features; not reproduced on Pi in this study</text>
  <rect x="620" y="330" width="130" height="28" fill="#9a3412" rx="5"/>
  <text x="685" y="350" text-anchor="middle" class="badge">Baseline A</text>

  <!-- RIGHT: PLCFusion -->
  <text x="1350" y="118" text-anchor="middle" class="subtitle">(B) PLCFusion - compiler-guided split kernelization (this work)</text>
  <rect x="940" y="860" width="820" height="48" class="hw" rx="6"/>
  <text x="1350" y="890" text-anchor="middle" class="label">COTS hardware (Raspberry Pi, ARM Cortex-A, PREEMPT_RT Linux)</text>

  <rect x="980" y="760" width="740" height="78" class="box-hl" rx="8"/>
  <text x="1350" y="790" text-anchor="middle" class="label">Single PREEMPT_RT Linux domain (no hypervisor split)</text>
  <text x="1350" y="818" text-anchor="middle" class="small">CPU isolation (soak/stress) | hrtimer | threaded IRQs | SCHED_FIFO</text>

  <rect x="980" y="520" width="360" height="210" class="box-kern" rx="8"/>
  <text x="1160" y="552" text-anchor="middle" class="label">Fused kernel module (*.ko)</text>
  <rect x="1010" y="570" width="300" height="58" class="box-hl" rx="6"/>
  <text x="1160" y="596" text-anchor="middle" class="small">Host: kthread + hrtimer / pthread</text>
  <text x="1160" y="618" text-anchor="middle" class="tiny">module_init | shutdown | debugfs stats</text>
  <rect x="1010" y="638" width="300" height="58" class="box" rx="6"/>
  <text x="1160" y="664" text-anchor="middle" class="small">kernel.o (fused algorithm)</text>
  <text x="1160" y="686" text-anchor="middle" class="tiny">timerthread / plc_cycle / main + DCE hot path</text>
  <text x="1160" y="714" text-anchor="middle" class="tiny">+ runtime stubs (plc_* ABI)</text>

  <rect x="1360" y="520" width="360" height="210" class="box" rx="8"/>
  <text x="1540" y="552" text-anchor="middle" class="label">Linux user space (same kernel)</text>
  <text x="1540" y="582" text-anchor="middle" class="small">Build toolchain | CI | soak/stress scripts</text>
  <text x="1540" y="608" text-anchor="middle" class="small">Optional background load (stress profile)</text>
  <text x="1540" y="634" text-anchor="middle" class="small">Rich Linux services remain available</text>
  <text x="1540" y="660" text-anchor="middle" class="tiny">Userspace cyclictest baseline for comparison</text>

  <path d="M 1340 630 L 1360 630" class="arrow"/>
  <text x="1350" y="622" text-anchor="middle" class="tiny">insmod</text>

  <rect x="980" y="300" width="740" height="190" class="box-hl" rx="8"/>
  <text x="1350" y="332" text-anchor="middle" class="label">Build-time toolchain (split kernelization)</text>
  <rect x="1010" y="350" width="130" height="42" class="box" rx="5"/>
  <text x="1075" y="377" text-anchor="middle" class="tiny">C sources</text>
  <path d="M 1140 371 L 1165 371" class="arrow-blue"/>
  <rect x="1165" y="350" width="130" height="42" class="box" rx="5"/>
  <text x="1230" y="377" text-anchor="middle" class="tiny">LLVM IR</text>
  <path d="M 1295 371 L 1320 371" class="arrow-blue"/>
  <rect x="1320" y="350" width="150" height="42" class="box-hl" rx="5"/>
  <text x="1395" y="377" text-anchor="middle" class="tiny">PLCFusion Pass</text>
  <path d="M 1470 371 L 1495 371" class="arrow-blue"/>
  <rect x="1495" y="350" width="130" height="42" class="box" rx="5"/>
  <text x="1560" y="377" text-anchor="middle" class="tiny">kernel.o</text>
  <path d="M 1560 392 L 1560 420 L 1160 420 L 1160 520" class="arrow-blue"/>
  <path d="M 1495 420 L 1525 420" class="arrow-blue"/>
  <rect x="1525" y="398" width="130" height="42" class="box" rx="5"/>
  <text x="1590" y="425" text-anchor="middle" class="tiny">host + stubs</text>
  <text x="1350" y="458" text-anchor="middle" class="small">Manifest-driven: remap | DCE | fixed-point | WCET tail | validate.json</text>
  <text x="1350" y="482" text-anchor="middle" class="tiny">Algorithm in kernel.o; lifecycle and POSIX ABI in host module</text>

  <rect x="980" y="140" width="740" height="130" class="box" rx="8"/>
  <text x="1350" y="172" text-anchor="middle" class="label">Isolation and predictability mechanism</text>
  <text x="1010" y="204" class="small">Temporal / control-path: in-kernel hot loop + CPU affinity + measurement gates</text>
  <text x="1010" y="232" class="small">No spatial OS split; trade rich-feature isolation for single-image deployability on Pi</text>
  <rect x="1520" y="248" width="130" height="28" fill="#1a4b8c" rx="5"/>
  <text x="1585" y="268" text-anchor="middle" class="badge">Method B</text>
</svg>
