<text x="600" y="30" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111">Fig.3 Split kernelization</text><text x="50" y="52" class="s" font-weight="600">① Build-time (compiler)</text><rect x="50" y="64" width="118" height="74" rx="6" fill="#fff" stroke="#333" stroke-width="2"/><text x="109.0" y="106.0" text-anchor="middle" class="box" font-size="11" font-weight="600">cyclictest.c</text><rect x="188" y="64" width="118" height="74" rx="6" fill="#fff" stroke="#333" stroke-width="2"/><text x="247.0" y="106.0" text-anchor="middle" class="box" font-size="11" font-weight="600">Clang / LLVM IR</text><rect x="326" y="64" width="128" height="74" rx="6" fill="#eef4ff" stroke="#1a4b8c" stroke-width="2"/><text x="390.0" y="106.0" text-anchor="middle" class="box" font-size="11" font-weight="600">PLCFusionPass</text><rect x="474" y="64" width="108" height="74" rx="6" fill="#f0fdf4" stroke="#166534" stroke-width="2"/><text x="528.0" y="106.0" text-anchor="middle" class="box" font-size="11" font-weight="600">*_kernel.o</text><rect x="602" y="64" width="138" height="74" rx="6" fill="#eef4ff" stroke="#1a4b8c" stroke-width="2"/><text x="671.0" y="106.0" text-anchor="middle" class="box" font-size="11" font-weight="600">plc_runner + stubs</text><rect x="760" y="64" width="108" height="74" rx="6" fill="#eee" stroke="#666" stroke-width="2"/><text x="814.0" y="106.0" text-anchor="middle" class="box" font-size="11" font-weight="600">Kbuild link</text><rect x="888" y="64" width="148" height="74" rx="6" fill="#fff" stroke="#1a4b8c" stroke-width="2"/><text x="962.0" y="106.0" text-anchor="middle" class="box" font-size="11" font-weight="600">cycletest_mod.ko</text><line x1="172" y1="101" x2="184" y2="101" stroke="#333" stroke-width="2" marker-end="url(#a)"/><line x1="310" y1="101" x2="322" y2="101" stroke="#333" stroke-width="2" marker-end="url(#a)"/><line x1="458" y1="101" x2="470" y2="101" stroke="#333" stroke-width="2" marker-end="url(#a)"/><line x1="586" y1="101" x2="598" y2="101" stroke="#333" stroke-width="2" marker-end="url(#a)"/><line x1="744" y1="101" x2="756" y2="101" stroke="#333" stroke-width="2" marker-end="url(#a)"/><line x1="872" y1="101" x2="884" y2="101" stroke="#333" stroke-width="2" marker-end="url(#a)"/><text x="50" y="160" class="s" font-weight="600">② Run-time (.ko interior) — static link</text><rect x="40" y="174" width="1120" height="388" rx="8" fill="#fafafa" stroke="#333" stroke-width="2"/><rect x="60" y="206" width="340" height="200" rx="8" fill="#eef4ff" stroke="#1a4b8c" stroke-width="2"/><text x="74" y="232" class="s" font-size="13">Host (plc_runner_official.c)</text><line x1="72" y1="238" x2="388" y2="238" stroke="#1a4b8c" stroke-width="1" opacity="0.35"/><text x="76" y="256" class="xs">module init / exit</text><text x="76" y="276" class="xs">pinned hrtimer (CPU3)</text><text x="76" y="296" class="xs">kthread + sigwait</text><text x="76" y="316" class="xs">jitter.bin export</text><text x="76" y="336" class="xs">wake timerthread()</text><rect x="430" y="206" width="340" height="200" rx="8" fill="#f0fdf4" stroke="#166534" stroke-width="2"/><text x="444" y="232" class="s" font-size="13">Algorithm (*_kernel.o)</text><line x1="442" y1="238" x2="758" y2="238" stroke="#166534" stroke-width="1" opacity="0.35"/><text x="446" y="256" class="xs">timerthread() [fused]</text><text x="446" y="276" class="xs">calcdiff / cyclictest</text><text x="446" y="296" class="xs">DCE-trimmed hot path</text><text x="446" y="316" class="xs">OptimizeNone on cycle fn</text><text x="446" y="336" class="xs">freestanding (no glibc)</text><rect x="800" y="206" width="340" height="200" rx="8" fill="#fff" stroke="#666" stroke-width="2"/><text x="814" y="232" class="s" font-size="13">Runtime stubs</text><line x1="812" y1="238" x2="1128" y2="238" stroke="#666" stroke-width="1" opacity="0.35"/><text x="816" y="256" class="xs">plc_pthread_*</text><text x="816" y="276" class="xs">plc_clock_gettime</text><text x="816" y="296" class="xs">plc_nanosleep → hrtimer</text><text x="816" y="316" class="xs">POSIX ABI for fused code</text><line x1="400" y1="306" x2="430" y2="306" stroke="#333" stroke-width="2" marker-end="url(#a)"/><text x="415.0" y="318.0" text-anchor="middle" class="xs" font-weight="600">calls</text><text x="50" y="420" class="s" font-weight="600">③ 1 ms tick path (CPU3)</text><rect x="60" y="440" width="1080" height="102" rx="6" fill="#fff7ed" stroke="#9a3412" stroke-width="2"/><rect x="78" y="472" width="148" height="56" rx="4" fill="#fff" stroke="#9a3412" stroke-width="2"/><text x="152.0" y="505.0" text-anchor="middle" class="box" font-size="11" font-weight="600">hrtimer IRQ</text><line x1="228" y1="500" x2="248" y2="500" stroke="#9a3412" stroke-width="2" marker-end="url(#o)"/><rect x="250" y="472" width="148" height="56" rx="4" fill="#fff" stroke="#9a3412" stroke-width="2"/><text x="324.0" y="505.0" text-anchor="middle" class="box" font-size="11" font-weight="600">record jitter</text><line x1="400" y1="500" x2="420" y2="500" stroke="#9a3412" stroke-width="2" marker-end="url(#o)"/><rect x="422" y="472" width="148" height="56" rx="4" fill="#fff" stroke="#9a3412" stroke-width="2"/><text x="496.0" y="505.0" text-anchor="middle" class="box" font-size="11" font-weight="600">wake thread</text><line x1="572" y1="500" x2="592" y2="500" stroke="#9a3412" stroke-width="2" marker-end="url(#o)"/><rect x="594" y="472" width="148" height="56" rx="4" fill="#f0fdf4" stroke="#166534" stroke-width="2"/><text x="668.0" y="505.0" text-anchor="middle" class="box" font-size="11" font-weight="600">fused calcdiff</text><line x1="744" y1="500" x2="764" y2="500" stroke="#9a3412" stroke-width="2" marker-end="url(#o)"/><rect x="766" y="472" width="148" height="56" rx="4" fill="#fff" stroke="#666" stroke-width="2"/><text x="840.0" y="505.0" text-anchor="middle" class="box" font-size="11" font-weight="600">FusedSummary</text><line x1="916" y1="500" x2="936" y2="500" stroke="#9a3412" stroke-width="2" marker-end="url(#o)"/><rect x="938" y="472" width="148" height="56" rx="4" fill="#fff" stroke="#666" stroke-width="2"/><text x="1012.0" y="505.0" text-anchor="middle" class="box" font-size="11" font-weight="600">export plots</text><text x="600" y="594" text-anchor="middle" class="s">Split: freestanding kernel.o (algorithm) + replaceable host .ko (lifecycle &amp; timing)</text><rect x="80" y="622" width="100" height="44" rx="6" fill="#f0fdf4" stroke="#166534" stroke-width="2"/><text x="130.0" y="649.0" text-anchor="middle" class="box" font-size="12" font-weight="600">insmod</text><rect x="280" y="622" width="640" height="44" rx="6" fill="#fafafa" stroke="#999" stroke-width="2"/><text x="600.0" y="649.0" text-anchor="middle" class="box" font-size="11" font-weight="600">module loaded on CPU3 — 1 kHz hrtimer running</text><rect x="1020" y="622" width="120" height="44" rx="6" fill="#fafafa" stroke="#666" stroke-width="2"/><text x="1080.0" y="649.0" text-anchor="middle" class="box" font-size="11" font-weight="600">safe_rmmod</text><line x1="180" y1="644" x2="280" y2="644" stroke="#333" stroke-width="2" marker-end="url(#a)"/><line x1="920" y1="644" x2="1020" y2="644" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
